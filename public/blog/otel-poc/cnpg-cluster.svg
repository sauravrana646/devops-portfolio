 <text x="72" y="155" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">apiVersion: postgresql.cnpg.io/v1</text><text x="72" y="188" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">kind: Cluster</text><text x="72" y="221" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">metadata:</text><text x="72" y="254" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">  name: poc-postgres</text><text x="72" y="287" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">spec:</text><text x="72" y="320" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">  instances: 1</text><text x="72" y="353" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">  imageName: ghcr.io/cloudnative-pg/postgresql:17</text><text x="72" y="386" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">  storage:</text><text x="72" y="419" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">    size: 2Gi</text><text x="72" y="452" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">    storageClass: local-path</text><text x="72" y="485" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">  monitoring:</text><text x="72" y="518" fill="#e7efeb" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve">    enablePodMonitor: false</text><text x="72" y="551" fill="#a8c5b5" font-size="21" font-family="SFMono-Regular,Consolas,monospace" xml:space="preserve"># Separate PodMonitor has release: kube-prometheus-stack</text>
