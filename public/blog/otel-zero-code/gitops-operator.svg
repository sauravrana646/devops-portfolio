<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 628" role="img" aria-label="Argo CD Application installing the OpenTelemetry Operator with a namespace selector">
<rect width="100%" height="100%" rx="18" fill="#F0FAF5"/>
<rect x="28" y="28" width="1124" height="572" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
