<rect x="28" y="60" width="1124" height="32" fill="#D8EFE4"/>
<circle cx="62" cy="60" r="8" fill="#E8A090"/>
<circle cx="88" cy="60" r="8" fill="#E8D49A"/>
<circle cx="114" cy="60" r="8" fill="#9DB8A8"/>
<text x="146" y="68" fill="#1a1a1a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Install the operator with GitOps</text>
<text x="56" y="118" fill="#5a7266" font-family="Inter,Arial,sans-serif" font-size="16">platform/argocd/applications/apps.yaml · selected fields</text>
<text x="56" y="154" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">kind: Application</text>
<text x="56" y="188" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">metadata:</text>
<text x="56" y="222" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  name: otel-operator</text>
<text x="56" y="256" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">spec:</text>
<text x="56" y="290" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  source:</text>
<text x="56" y="324" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    chart: opentelemetry-operator</text>
<text x="56" y="358" fill="#3d6b8a" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    targetRevision: 0.124.0</text>
<text x="56" y="392" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    helm:</text>
<text x="56" y="426" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      valuesObject:</text>
<text x="56" y="460" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">        admissionWebhooks:</text>
<text x="56" y="494" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">          namespaceSelector:</text>
<text x="56" y="528" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">            matchLabels:</text>
<text x="56" y="562" fill="#3d6b8a" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">              otel-injection: enabled</text>
