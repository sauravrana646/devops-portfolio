<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-label="OpenTelemetry Collector pipelines for traces, metrics, and logs">
<rect width="100%" height="100%" rx="18" fill="#F0FAF5"/>
<rect x="28" y="28" width="1124" height="504" rx="14" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2"/>
<rect x="28" y="28" width="1124" height="64" rx="14" fill="#D8EFE4"/>
<rect x="28" y="60" width="1124" height="32" fill="#D8EFE4"/>
<circle cx="62" cy="60" r="8" fill="#E8A090"/>
<circle cx="88" cy="60" r="8" fill="#E8D49A"/>
<circle cx="114" cy="60" r="8" fill="#9DB8A8"/>
<text x="146" y="68" fill="#1a1a1a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Route signals through one Collector</text>
<text x="56" y="118" fill="#5a7266" font-family="Inter,Arial,sans-serif" font-size="16">platform/observability/collector.yaml · selected fields</text>
<text x="56" y="154" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">service:</text>
<text x="56" y="188" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">  pipelines:</text>
<text x="56" y="222" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    traces:</text>
<text x="56" y="256" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      receivers: [otlp]</text>
<text x="56" y="290" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      exporters: [otlp/tempo, otlp/jaeger, spanmetrics, servicegraph]</text>
<text x="56" y="324" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    metrics:</text>
<text x="56" y="358" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      receivers: [otlp, spanmetrics, servicegraph]</text>
<text x="56" y="392" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      exporters: [prometheus]</text>
<text x="56" y="426" fill="#2f6f5e" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">    logs:</text>
<text x="56" y="460" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      receivers: [otlp]</text>
<text x="56" y="494" fill="#243038" font-size="20" font-family="SFMono-Regular,Menlo,Consolas,monospace" xml:space="preserve">      exporters: [otlphttp/loki]</text>
</svg>
